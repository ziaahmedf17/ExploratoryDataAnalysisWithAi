[client]
toolbarMode = "minimal"   # hides the Deploy button and dev menu

[browser]
gatherUsageStats = false

# "Split Terminal" theme
[theme]
base = "dark"
primaryColor = "#97C459"
backgroundColor = "#121211"
secondaryBackgroundColor = "#1B1B19"
textColor = "#D3D1C7"
borderColor = "#2E2E2B"
dataframeBorderColor = "#2E2E2B"
dataframeHeaderBackgroundColor = "#1B1B19"
codeBackgroundColor = "#161615"
linkColor = "#97C459"
baseRadius = "8px"
showWidgetBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
headingFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
baseFontSize = 14

[theme.sidebar]
backgroundColor = "#161615"
secondaryBackgroundColor = "#1B1B19"
